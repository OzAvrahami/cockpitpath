<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;height:100%;min-height:0;background:#101317;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;font-family:'IBM Plex Mono',ui-monospace,monospace">
  <div style="position:relative;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 13px;background:#151A1F;color:#A7B1BF;font-size:10px;letter-spacing:0.1em;flex:none">
    <span>OVERHEAD &rarr; ELECTRICAL</span>
    <span style="color:#79838F">BASE IMAGE &middot; overhead-electrical.webp</span>
  </div>

  <div style="flex:1;min-height:0;position:relative;background:#15181C;padding:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden">
    <div style="flex:none;display:grid;grid-template-columns:1.4fr 1fr;gap:10px">
      <div style="background:#1B1F24;border-radius:5px;padding:7px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px">
        <span style="font-size:9px;letter-spacing:0.12em;color:#79838F">AC / DC METERING</span>
        <div style="display:flex;gap:6px">
          <div style="width:26px;height:14px;border-radius:2px;background:#252A31"></div>
          <div style="width:26px;height:14px;border-radius:2px;background:#252A31"></div>
        </div>
      </div>
      <div style="background:#1B1F24;border-radius:5px;padding:7px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px">
        <span style="font-size:9px;letter-spacing:0.12em;color:#79838F">MAINT</span>
        <div style="width:26px;height:14px;border-radius:2px;background:#252A31"></div>
      </div>
    </div>

    <div style="flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
      <div style="background:#1B1F24;border-radius:5px;padding:8px 9px;display:flex;flex-direction:column;gap:7px;min-height:0">
        <div style="font-size:9px;letter-spacing:0.12em;color:#79838F">STANDBY PWR</div>
        <div style="height:18px;border-radius:3px;background:#282E35;display:flex;align-items:center;padding:3px"><div style="width:14px;height:100%;border-radius:2px;background:#525C68"></div></div>
        <div style="height:18px;border-radius:3px;background:#282E35;display:flex;align-items:center;padding:3px"><div style="width:14px;height:100%;border-radius:2px;background:#525C68"></div></div>
        <div style="margin-top:auto;height:9px;border-radius:2px;background:#222831"></div>
      </div>

      <div style="position:relative;z-index:2;background:#1B1F24;border-radius:5px;padding:8px 9px;display:flex;flex-direction:column;gap:7px;min-height:0">
        <div style="font-size:9px;letter-spacing:0.12em;color:#CBD3DC">BATTERY</div>
        <div style="height:18px;border-radius:3px;background:#333A43;display:flex;align-items:center;justify-content:flex-end;padding:3px"><div style="width:14px;height:100%;border-radius:2px;background:#93A0AE"></div></div>
        <div style="height:18px;border-radius:3px;background:#282E35;display:flex;align-items:center;padding:3px"><div style="width:14px;height:100%;border-radius:2px;background:#525C68"></div></div>
        <div style="margin-top:auto;height:9px;border-radius:2px;background:#222831"></div>

        <div style="position:absolute;inset:-8px;border:2px solid #57E0E8;border-radius:9px;box-shadow:0 0 0 9999px rgba(6,8,10,0.7),0 0 26px rgba(87,224,232,0.28);pointer-events:none;z-index:3"></div>
        <div style="position:absolute;left:-15px;top:-15px;width:13px;height:13px;border-left:2px solid #F2F4F6;border-top:2px solid #F2F4F6;pointer-events:none;z-index:4"></div>
        <div style="position:absolute;right:-15px;top:-15px;width:13px;height:13px;border-right:2px solid #F2F4F6;border-top:2px solid #F2F4F6;pointer-events:none;z-index:4"></div>
        <div style="position:absolute;left:-15px;bottom:-15px;width:13px;height:13px;border-left:2px solid #F2F4F6;border-bottom:2px solid #F2F4F6;pointer-events:none;z-index:4"></div>
        <div style="position:absolute;right:-15px;bottom:-15px;width:13px;height:13px;border-right:2px solid #F2F4F6;border-bottom:2px solid #F2F4F6;pointer-events:none;z-index:4"></div>

        <div style="position:absolute;left:calc(100% + 16px);top:50%;transform:translateY(-50%);z-index:5;display:flex;align-items:center;gap:0">
          <div style="width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:7px solid #57E0E8"></div>
          <div style="background:#57E0E8;color:#04191B;font-size:10px;font-weight:600;letter-spacing:0.12em;padding:5px 9px;border-radius:3px;white-space:nowrap">BATTERY SWITCH</div>
        </div>
      </div>

      <div style="background:#1B1F24;border-radius:5px;padding:8px 9px;display:flex;flex-direction:column;gap:7px;min-height:0">
        <div style="font-size:9px;letter-spacing:0.12em;color:#79838F">GRD PWR / APU</div>
        <div style="height:18px;border-radius:3px;background:#282E35;display:flex;align-items:center;padding:3px"><div style="width:14px;height:100%;border-radius:2px;background:#525C68"></div></div>
        <div style="height:18px;border-radius:3px;background:#282E35;display:flex;align-items:center;padding:3px"><div style="width:14px;height:100%;border-radius:2px;background:#525C68"></div></div>
        <div style="margin-top:auto;height:9px;border-radius:2px;background:#222831"></div>
      </div>

      <div style="background:#1B1F24;border-radius:5px;padding:8px 9px;display:flex;flex-direction:column;gap:7px;min-height:0">
        <div style="font-size:9px;letter-spacing:0.12em;color:#79838F">GEN / BUS</div>
        <div style="height:9px;border-radius:2px;background:#222831"></div>
        <div style="height:9px;border-radius:2px;background:#222831"></div>
        <div style="margin-top:auto;height:18px;border-radius:3px;background:#282E35;display:flex;align-items:center;padding:3px"><div style="width:14px;height:100%;border-radius:2px;background:#525C68"></div></div>
      </div>
    </div>
  </div>

  <div style="position:relative;z-index:6;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 13px;background:#151A1F;color:#79838F;font-size:9px;letter-spacing:0.08em">
    <span>HOTSPOT &middot; battery</span>
    <span>PLACEHOLDER &mdash; OVERLAY RENDERED DYNAMICALLY</span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:340}}"></script>
</body>
</html>
