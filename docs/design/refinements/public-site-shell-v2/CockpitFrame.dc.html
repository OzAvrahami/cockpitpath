<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;height:100%;min-height:0;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(135deg,#141A1F 0 10px,#0F1418 10px 20px)">
  <div style="position:absolute;inset:0;background:linear-gradient(to top, rgba(6,7,9,0.5) 0%, rgba(6,7,9,0) 45%)"></div>
  <div style="position:absolute;left:16px;top:16px;width:16px;height:16px;border-left:1.5px solid rgba(242,244,246,0.35);border-top:1.5px solid rgba(242,244,246,0.35)"></div>
  <div style="position:absolute;right:16px;top:16px;width:16px;height:16px;border-right:1.5px solid rgba(242,244,246,0.35);border-top:1.5px solid rgba(242,244,246,0.35)"></div>
  <div style="position:absolute;left:16px;bottom:16px;width:16px;height:16px;border-left:1.5px solid rgba(242,244,246,0.35);border-bottom:1.5px solid rgba(242,244,246,0.35)"></div>
  <div style="position:absolute;right:16px;bottom:16px;width:16px;height:16px;border-right:1.5px solid rgba(242,244,246,0.35);border-bottom:1.5px solid rgba(242,244,246,0.35)"></div>
  <div style="position:absolute;left:34px;bottom:16px;max-width:70%;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;color:rgba(242,244,246,0.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ caption }}</div>
  <div style="position:absolute;right:16px;top:38px;font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:0.1em;color:rgba(242,244,246,0.32);text-align:right;white-space:nowrap">CAPTURE PENDING</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:320},&quot;caption&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;BOEING 737 MAX 8 \u00b7 FLIGHT DECK&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
